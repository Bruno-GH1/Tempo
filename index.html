<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f8fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempo">
<title>Como vai estar o tempo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of stacked panels. Header with place chips and search, then now + next 24h side by side, then a 15-day strip (7 past, today, 7 ahead). */
:root {
  --bg: #eef2f4;
  --panel: rgba(255, 255, 255, 0.86);
  --panel-solid: #ffffff;
  --sky: linear-gradient(180deg, #3f8fd8 0%, #8cc4ee 55%, #d9ecf9 100%);
  --onsky: #0b2236;
  --ink: #14232e;
  --muted: #5d6f7b;
  --line: #d6dee3;
  --accent: #0f6e8c;
  --warm: #d98e04;
  --cool: #3b6fb6;
  --rain: #3b6fb6;
  --bad: #b3261e;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a22;
    --panel: rgba(21, 37, 47, 0.82); --panel-solid: #15252f;
    --ink: #e6eef2;
    --muted: #92a6b2;
    --line: #26384388;
    --accent: #5fc0de;
    --warm: #f0b43a;
    --cool: #7aa7e6;
    --rain: #7aa7e6;
    --bad: #f2877f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a22;
  --panel: rgba(21, 37, 47, 0.82); --panel-solid: #15252f;
  --ink: #e6eef2;
  --muted: #92a6b2;
  --line: #26384388;
  --accent: #5fc0de;
  --warm: #f0b43a;
  --cool: #7aa7e6;
  --rain: #7aa7e6;
  --bad: #f2877f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
/* Sky behind the panels. Script sets data-sky (clear, fair, partly, cloudy, fog, rain, snow, storm) and data-night (0 or 1). */
body[data-sky="clear"], body[data-sky="fair"] { --sky: linear-gradient(180deg, #3f8fd8 0%, #8cc4ee 55%, #d9ecf9 100%); --onsky: #0b2236; }
body[data-sky="partly"] { --sky: linear-gradient(180deg, #4f93d2 0%, #9dc3e2 55%, #d7e6f1 100%); --onsky: #0b2236; }
body[data-sky="cloudy"] { --sky: linear-gradient(180deg, #8499ab 0%, #b4c2ce 55%, #d6dee4 100%); --onsky: #0f202b; }
body[data-sky="fog"] { --sky: linear-gradient(180deg, #a3afb7 0%, #cbd2d7 60%, #e1e5e8 100%); --onsky: #0f202b; }
body[data-sky="rain"] { --sky: linear-gradient(180deg, #3d5160 0%, #61778a 55%, #8a9cab 100%); --onsky: #ffffff; }
body[data-sky="storm"] { --sky: linear-gradient(180deg, #1f2a36 0%, #3d4c5b 55%, #5f7081 100%); --onsky: #ffffff; }
body[data-sky="snow"] { --sky: linear-gradient(180deg, #aebfce 0%, #d3dde6 55%, #eef2f6 100%); --onsky: #0f202b; }
body[data-night="1"][data-sky="clear"], body[data-night="1"][data-sky="fair"] { --sky: linear-gradient(180deg, #050d20 0%, #0f2145 60%, #1d3a66 100%); --onsky: #ffffff; }
body[data-night="1"][data-sky="partly"] { --sky: linear-gradient(180deg, #0a1428 0%, #16284a 60%, #27416a 100%); --onsky: #ffffff; }
body[data-night="1"][data-sky="cloudy"] { --sky: linear-gradient(180deg, #0d1622 0%, #1c2b3b 60%, #2f4256 100%); --onsky: #ffffff; }
body[data-night="1"][data-sky="fog"] { --sky: linear-gradient(180deg, #1a2430 0%, #2a3643 60%, #3b4958 100%); --onsky: #ffffff; }
body[data-night="1"][data-sky="rain"] { --sky: linear-gradient(180deg, #0b131c 0%, #17232f 60%, #27384a 100%); --onsky: #ffffff; }
body[data-night="1"][data-sky="storm"] { --sky: linear-gradient(180deg, #070b11 0%, #131c27 60%, #242f3d 100%); --onsky: #ffffff; }
body[data-night="1"][data-sky="snow"] { --sky: linear-gradient(180deg, #1b2838 0%, #2e4258 60%, #4a627a 100%); --onsky: #ffffff; }

/* cloud and fog colours */
body { --cloud: rgba(255, 255, 255, 0.92); --fogc: #ffffff; }
body[data-sky="cloudy"] { --cloud: rgba(226, 233, 239, 0.92); }
body[data-sky="rain"] { --cloud: rgba(98, 113, 127, 0.92); }
body[data-sky="storm"] { --cloud: rgba(58, 70, 84, 0.94); }
body[data-sky="snow"] { --cloud: rgba(240, 244, 248, 0.95); }
body[data-night="1"] { --cloud: rgba(125, 145, 180, 0.38); --fogc: #8da2b8; }
body[data-night="1"][data-sky="cloudy"] { --cloud: rgba(72, 90, 112, 0.6); }
body[data-night="1"][data-sky="rain"] { --cloud: rgba(40, 54, 70, 0.85); }
body[data-night="1"][data-sky="storm"] { --cloud: rgba(26, 34, 46, 0.92); }
body[data-night="1"][data-sky="snow"] { --cloud: rgba(115, 135, 160, 0.6); }

body {
  background: var(--sky);
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
h1 { color: var(--onsky); font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; margin: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 0.85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #ffffff; font-weight: 600; }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; }

.places { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 0.9rem; }
.chip[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.remove { border: 0; background: transparent; color: var(--onsky); font-size: 0.8rem; text-decoration: underline; padding: 6px 4px; }

.search { position: relative; flex: 0 0 auto; width: 100%; min-width: 0; max-width: 340px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; list-style: none; margin: 0; padding: 4px; max-height: 50vh; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; }
.results button:hover, .results button:focus-visible { background: var(--bg); }
.results small { color: var(--muted); }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.label { font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.top { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 5fr); gap: 16px; }
@media (max-width: 760px) { .top { grid-template-columns: minmax(0, 1fr); } }

.now-temp { font-family: var(--font-display); font-weight: 700; font-size: 4.2rem; line-height: 1; letter-spacing: -0.03em; }
.now-temp sup { font-size: 1.5rem; font-weight: 500; color: var(--muted); vertical-align: top; margin-left: 4px; position: relative; top: 0.35em; }
.now-cond { font-size: 1.1rem; margin: 6px 0 0; }
.now-feels, .now-vs { color: var(--muted); margin: 0; }
.rain-sum { margin: 14px 0 0; font-weight: 500; }
.rain-sum.wet { color: var(--rain); }
.facts dd small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 18px 0 0; }
.facts div { border-top: 1px solid var(--line); padding-top: 8px; }
.facts dt { font-family: var(--font-data); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }

.chartwrap { overflow-x: auto; }
.chart { width: 100%; height: auto; display: block; }
.chart .temp-label { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--panel-solid); stroke-width: 3px; stroke-linejoin: round; }
.chart .daytint { fill: var(--ink); opacity: 0.055; }
.chart .divider { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .daychip { fill: var(--accent); }
.chart .daychip-text { font-family: var(--font-data); font-size: 9.5px; letter-spacing: 0.06em; font-weight: 500; fill: var(--panel-solid); }
.chart-hint { margin: 6px 0 0; color: var(--muted); font-size: 0.78rem; }
.chart .rain-label { font-family: var(--font-data); font-size: 10px; fill: var(--rain); }
.chart .rain-label.zero { opacity: 0.45; }
.chart .row-label { font-family: var(--font-data); font-size: 9px; fill: var(--muted); }
.chart .wind-label { font-family: var(--font-data); font-size: 9px; fill: var(--ink); }
.chart text { font-family: var(--font-data); font-size: 10px; fill: var(--muted); }
.chart .time-label { font-family: var(--font-display); font-size: 11px; font-weight: 700; fill: var(--ink); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--warm); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--warm); opacity: 0.12; }
.chart .bar { fill: var(--rain); opacity: 0.45; }
.chart .dot { fill: var(--warm); stroke: var(--panel); stroke-width: 2; }
.legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* daily strip */
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 64px minmax(0, 1fr) 32px minmax(48px, 72px) 32px; align-items: center; gap: 8px; padding: 8px 0; flex: 1 1 auto; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.day:first-child { border-top: 0; }
.day.past { color: var(--muted); }
.day.today { font-weight: 600; }
.day .dname { font-family: var(--font-data); font-size: 0.82rem; }
.day .dcond { min-width: 0; display: flex; flex-direction: column; font-size: 0.85rem; line-height: 1.25; }
.day .dcond small { color: var(--muted); font-family: var(--font-data); font-size: 0.72rem; }
.day .lo { text-align: right; color: var(--cool); }
.day .hi { color: var(--warm); }
.dayspanel .days { flex: 1 1 auto; }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--cool), var(--warm)); }
.day.past .fill { opacity: 0.55; }
.dayhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.mapbar { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.mapbar .label { margin: 0; }
.mapbar a { font-size: 0.85rem; color: var(--accent); }
@media (pointer: coarse) { .mapbar a { display: inline-flex; align-items: center; min-height: 40px; } }
.mapwrap { position: relative; flex: 1 1 auto; min-height: 440px; }
.mapframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; background: var(--bg); display: block; }
/* On touch screens a transparent shield lets the page scroll past the map until the map is tapped */
.mapshield { display: none; position: absolute; inset: 0; border: 0; background: transparent; align-items: flex-end; justify-content: center; padding: 12px; border-radius: 8px; }
.mapshield span { background: rgba(10, 20, 30, 0.74); color: #ffffff; padding: 6px 14px; border-radius: 999px; font-size: 0.82rem; }
.mapshield.unlocked { inset: auto 10px 10px auto; padding: 0; }
@media (pointer: coarse) { .mapshield { display: flex; } }
.duo { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; align-items: stretch; }
.duo > .panel { display: flex; flex-direction: column; min-height: 600px; }
@media (max-width: 860px) { .duo { grid-template-columns: minmax(0, 1fr); } .duo > .panel { min-height: 0; } }
.status { color: var(--onsky); opacity: 0.9; font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }
.error { border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
/* ---- IPMA warnings banner ---- */
.warn { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.warn-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.warn-head .label { margin: 0; }
.warn-head a { font-size: 0.85rem; color: var(--accent); }
.warn details { border-top: 1px solid var(--line); padding-top: 10px; }
.warn details:first-of-type { border-top: 0; padding-top: 0; }
.warn summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.warn summary::-webkit-details-marker { display: none; }
.warn summary::after { content: "+"; margin-left: auto; color: var(--muted); font-family: var(--font-data); }
.warn details[open] summary::after { content: "–"; }
.lvl { font-family: var(--font-data); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
.lvl.yellow { background: #f5c518; color: #2b2200; }
.lvl.orange { background: #f28a1a; color: #2a1400; }
.lvl.red { background: #d93030; color: #ffffff; }
.warn-type { font-weight: 600; }
.warn-when { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.warn-text { margin: 8px 0 0; font-size: 0.9rem; }
.warn-ok { margin: 0; color: var(--muted); font-size: 0.9rem; }

/* ---- phones ---- */
@media (max-width: 560px) {
  .panel { padding: 16px; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .warn { padding: 12px 14px; }
  .now-temp { font-size: 3.6rem; }
  .search { max-width: none; }
  .search input { font-size: 16px; }
  .mapwrap { min-height: 380px; }
  header { gap: 8px 12px; }
}
@media (pointer: coarse) {
  .chip, .ghost, .seg button, .remove, .results button, .search input { min-height: 40px; }
}

/* ---- sky scene: layers sit behind the content and are switched on by data-sky / data-night ---- */
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--sky); }
.sky > div { position: absolute; inset: 0; display: none; }
#clouds { display: block; }
#sun, #moon { inset: auto; left: var(--cx, 80%); top: var(--cy, 20%); transform: translate(-50%, -50%); }
#sun { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #fffbe6 0, #ffe27a 45%, #ffc83d 100%); box-shadow: 0 0 60px 30px rgba(255, 216, 110, 0.55), 0 0 170px 90px rgba(255, 200, 90, 0.25); }
#moon { width: 96px; height: 96px; filter: drop-shadow(0 0 16px rgba(210, 222, 255, 0.6)); }
#moon svg { width: 100%; height: 100%; display: block; }
.star { position: absolute; border-radius: 50%; background: #ffffff; opacity: 0.8; }
.cloud { position: absolute; left: calc(var(--x) * 1%); top: calc(var(--t) * 1%); width: 220px; height: 64px; border-radius: 64px; background: var(--cloud); transform: scale(var(--s)); transform-origin: left center; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 100px; height: 100px; left: 34px; top: -48px; }
.cloud::after { width: 76px; height: 76px; right: 34px; top: -32px; }
#fog { background: radial-gradient(ellipse 60% 22% at 30% 38%, var(--fogc), transparent), radial-gradient(ellipse 70% 20% at 75% 66%, var(--fogc), transparent), radial-gradient(ellipse 55% 18% at 45% 16%, var(--fogc), transparent); filter: blur(14px); opacity: 0.55; }
.drop { position: absolute; top: 0; left: var(--l); width: 1.5px; height: var(--h); background: linear-gradient(to bottom, transparent, rgba(210, 228, 248, 0.85)); transform: translateY(var(--y)) rotate(12deg); }
.flake { position: absolute; top: 0; left: var(--l); width: var(--w); height: var(--w); border-radius: 50%; background: #ffffff; opacity: 0.9; transform: translateY(var(--y)); }
#flash { background: #ffffff; opacity: 0; }

body[data-night="0"] #sun { display: block; }
body[data-night="1"] #moon { display: block; }
body[data-night="1"][data-sky="clear"] #stars, body[data-night="1"][data-sky="fair"] #stars { display: block; opacity: 0.95; }
body[data-night="1"][data-sky="partly"] #stars { display: block; opacity: 0.5; }
body[data-sky="fog"] #fog { display: block; }
body[data-sky="rain"] #rain, body[data-sky="storm"] #rain { display: block; opacity: var(--rain-o, 0.6); }
body[data-sky="snow"] #snow { display: block; }
body[data-sky="storm"] #flash { display: block; }
body[data-night="0"][data-sky="cloudy"] #sun, body[data-night="1"][data-sky="cloudy"] #moon { opacity: 0.35; }
body[data-night="0"][data-sky="fog"] #sun, body[data-night="1"][data-sky="fog"] #moon { opacity: 0.3; }
body[data-sky="rain"] #sun, body[data-sky="rain"] #moon, body[data-sky="storm"] #sun, body[data-sky="storm"] #moon, body[data-sky="snow"] #sun, body[data-sky="snow"] #moon { display: none; }
body[data-sky="clear"] .cloud { display: none; }
body[data-sky="fair"] .cloud:nth-child(n+2) { display: none; }
body[data-sky="partly"] .cloud:nth-child(n+4) { display: none; }
body[data-sky="fog"] .cloud:nth-child(n+3) { display: none; }

@keyframes drift { from { left: -340px; } to { left: 105%; } }
@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@keyframes fall { from { transform: translate3d(0, -40px, 0) rotate(12deg); } to { transform: translate3d(-30px, 105vh, 0) rotate(12deg); } }
@keyframes snowfall { from { transform: translate3d(0, -10px, 0); } to { transform: translate3d(40px, 105vh, 0); } }
@keyframes flash { 0%, 90%, 100% { opacity: 0; } 91% { opacity: 0.45; } 92% { opacity: 0; } 94% { opacity: 0.3; } 96% { opacity: 0; } }
@keyframes mist { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
@media (prefers-reduced-motion: no-preference) {
  .cloud { animation: drift var(--dur) linear var(--delay) infinite; }
  .star { animation: twinkle 5s ease-in-out infinite; }
  .drop { animation: fall var(--d) linear var(--dl) infinite; }
  .flake { animation: snowfall var(--d) linear var(--dl) infinite; }
  body[data-sky="storm"] #flash { animation: flash 9s linear infinite; }
  #fog { animation: mist 20s ease-in-out infinite alternate; }
}

[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: left .3s, right .3s; } }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true">
  <div id="stars"></div>
  <div id="sun"></div>
  <div id="moon"></div>
  <div id="clouds"></div>
  <div id="fog"></div>
  <div id="rain"></div>
  <div id="snow"></div>
  <div id="flash"></div>
</div>
<div class="wrap">
  <header>
    <h1>Como vai estar o tempo?</h1>
    <div class="tools">
      <button type="button" class="ghost" id="refresh">E agora?</button>
    </div>
  </header>

  <div class="places" id="places"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Adicionar local, por exemplo Porto" autocomplete="off" aria-label="Pesquisar um local">
    <ul class="results" id="results" hidden></ul>
  </div>

  <div class="error" id="error" role="alert" hidden></div>

  <section class="panel warn" id="warn" aria-live="polite" hidden></section>

  <section class="top">
    <div class="panel" id="now">

  </div>

  <div class="status"><span id="updated">Ainda não foi carregado</span><span>Dados da Open-Meteo</span></div>
</div>

<script>
(function () {
  "use strict";

  var WMO = {0:"Céu limpo",1:"Pouco nublado",2:"Parcialmente nublado",3:"Encoberto",45:"Nevoeiro",48:"Nevoeiro gelado",51:"Chuvisco fraco",53:"Chuvisco",55:"Chuvisco forte",56:"Chuvisco gelado",57:"Chuvisco gelado",61:"Chuva fraca",63:"Chuva",65:"Chuva forte",66:"Chuva gelada",67:"Chuva gelada",71:"Neve fraca",73:"Neve",75:"Neve forte",77:"Grãos de neve",80:"Aguaceiros fracos",81:"Aguaceiros",82:"Aguaceiros fortes",85:"Aguaceiros de neve",86:"Aguaceiros fortes de neve",95:"Trovoada",96:"Trovoada com granizo",99:"Trovoada forte com granizo"};
  var COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
  var DEFAULT_PLACES = [{ name: "Montijo", country: "Portugal", admin1: "Setúbal", area: "STB", lat: 38.7066, lon: -8.9733 }];
  var REFRESH_MS = 15 * 60 * 1000;

  /* IPMA warning areas (mainland districts): code -> [name, capital latitude, capital longitude] */
  var IPMA_URL = "https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json";
  var IPMA_LINK = "https://www.ipma.pt/pt/otempo/prev.aviso/";
  var AREAS = {
    AVR: ["Aveiro", 40.64, -8.65], BJA: ["Beja", 38.02, -7.87], BRG: ["Braga", 41.55, -8.42], BGC: ["Bragança", 41.81, -6.76],
    CBO: ["Castelo Branco", 39.82, -7.49], CBR: ["Coimbra", 40.21, -8.43], EVR: ["Évora", 38.57, -7.91], FAR: ["Faro", 37.02, -7.93],
    GDA: ["Guarda", 40.54, -7.27], LRA: ["Leiria", 39.74, -8.81], LSB: ["Lisboa", 38.72, -9.14], PTG: ["Portalegre", 39.29, -7.43],
    PRT: ["Porto", 41.15, -8.61], STM: ["Santarém", 39.24, -8.69], STB: ["Setúbal", 38.52, -8.89], VCT: ["Viana do Castelo", 41.69, -8.83],
    VRL: ["Vila Real", 41.30, -7.74], VIS: ["Viseu", 40.66, -7.91]
  };

  var state = { places: DEFAULT_PLACES.slice(), active: 0, units: "metric", layer: "rain", data: null, fetchedAt: null, warnings: null, warnError: false };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }

  function tempUnit() { return "°C"; }
  function windUnit() { return "km/h"; }
  function round(n) { return Math.round(n); }
  function cond(code) { return WMO[code] || "Condição desconhecida"; }

  /* ---------- data ---------- */
  function forecastUrl(p) {
    var imp = state.units === "imperial";
    return "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + p.lat + "&longitude=" + p.lon +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day" +
      "&hourly=temperature_2m,precipitation_probability,precipitation,wind_gusts_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,uv_index_max,sunrise,sunset" +
      "&past_days=1&forecast_days=8&timezone=auto" +
      "&temperature_unit=" + (imp ? "fahrenheit" : "celsius") +
      "&wind_speed_unit=" + (imp ? "mph" : "kmh") +
      "&precipitation_unit=" + (imp ? "inch" : "mm");
  }

  var reqId = 0;
  function fetchWeather() {
    var p = state.places[state.active];
    var id = ++reqId;
    hideError();
    fetchWarnings();
    $("updated").textContent = "A atualizar...";
    return fetch(forecastUrl(p))
      .then(function (r) { if (!r.ok) throw new Error("O serviço meteorológico respondeu com o código " + r.status + "."); return r.json(); })
      .then(function (d) {
        if (id !== reqId) return;
        state.data = d;
        state.fetchedAt = new Date();
        render();
      })
      .catch(function (e) {
        if (id !== reqId) return;
        var offline = (typeof navigator !== "undefined" && navigator.onLine === false);
        showError(offline ? 'Parece que não tens ligação à Internet. Volta a ligar-te e prime "E agora?".' : (e && e.message ? e.message : "Não foi possível carregar a meteorologia.") + ' Prime "E agora?" para tentar novamente.');
        $("updated").textContent = state.fetchedAt ? "Última atualização às " + timeLabel(state.fetchedAt) + " (dados desatualizados)" : "Não carregado";
      });
  }

  function showError(msg) { var e = $("error"); e.textContent = msg; e.hidden = false; }
  function hideError() { $("error").hidden = true; }
  function timeLabel(d) { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

  /* ---------- render ---------- */
  /* ---------- live map (Windy embed) ---------- */
  function updateMap() {
    var p = state.places[state.active];
    var imp = state.units === "imperial";
    var q = {
      lat: p.lat, lon: p.lon, detailLat: p.lat, detailLon: p.lon,
      zoom: state.layer === "rain" ? 7 : 6,
      level: "surface", overlay: state.layer, product: "ecmwf",
      menu: "", message: "true", marker: "true", calendar: "now", type: "map",
      location: "coordinates", detail: "", metricWind: imp ? "mph" : "km/h", language: "pt",
      metricTemp: imp ? "°F" : "°C", radarRange: "-1"
    };
    var parts = [];
    for (var k in q) parts.push(k + "=" + encodeURIComponent(q[k]));
    var src = "https://embed.windy.com/embed2.html?" + parts.join("&");
    var frame = $("map");
    if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
    $("map-label").textContent = "Mapa em direto · " + p.name;
    $("map-link").href = "https://zoom.earth/maps/" + (state.layer === "wind" ? "wind-speed" : "precipitation") + "/#view=" + p.lat.toFixed(3) + "," + p.lon.toFixed(3) + ",7z";
    var btns = document.querySelectorAll("[data-layer]");
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-layer") === state.layer));
  }
  var layerBtns = document.querySelectorAll("[data-layer]");
  for (var li = 0; li < layerBtns.length; li++) {
    layerBtns[li].addEventListener("click", function () {
      state.layer = this.getAttribute("data-layer");
      updateMap();
    });
  }

  function render() {
    renderPlaces();
    updateMap();
    renderWarnings();
    if (!state.data) return;
    renderNow();
    renderHourly();
    renderDays();
    $("updated").textContent = "Atualizado às " + timeLabel(state.fetchedAt) + " · atualização automática a cada 15 minutos";
  }

  function renderPlaces() {
    var box = $("places");
    box.textContent = "";
    state.places.forEach(function (p, i) {
      var b = el("button", "chip", p.name);
      b.type = "button";
      if (i === state.active) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { state.active = i; store("wl.active", i); state.data = null; clearView(); render(); fetchWeather(); });
      box.appendChild(b);
    });
    if (state.places.length > 1) {
      var r = el("button", "remove", "Remover " + state.places[state.active].name);
      r.type = "button";
      r.addEventListener("click", function () {
        state.places.splice(state.active, 1);
        state.active = 0;
        store("wl.places", state.places); store("wl.active", 0);
        state.data = null; clearView(); render(); fetchWeather();
      });
      box.appendChild(r);
    }
  }

  function clearView() {
    $("now-temp").textContent = "--";
    $("now-cond").textContent = "A carregar";
    $("now-feels").textContent = "";
    $("now-vs").textContent = "";
    $("rain-sum").textContent = "";
    $("rain-sum").className = "rain-sum";
    $("facts").textContent = "";
    $("hourly").textContent = "";
    $("days").textContent = "";
  }

  /* ---------- sky scene: sun or moon, clouds, stars, rain, snow, fog ---------- */
  function kindFor(code) {
    if (code === 0) return "clear";
    if (code === 1) return "fair";
    if (code === 2) return "partly";
    if (code === 3) return "cloudy";
    if (code === 45 || code === 48) return "fog";
    if (code >= 95) return "storm";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    return "cloudy";
  }
  function rainStrength(code) {
    if (code >= 95) return 0.8;
    if (code === 51 || code === 53 || code === 56 || code === 61 || code === 80) return 0.4;
    if (code === 55 || code === 57 || code === 63 || code === 66 || code === 81) return 0.6;
    return 0.8;
  }
  function moonPhase(date) {
    var jd = date.getTime() / 86400000 + 2440587.5;
    var p = ((jd - 2451550.1) / 29.530588853) % 1;
    return p < 0 ? p + 1 : p;
  }
  function moonSvg(p) {
    var r = 44, c = Math.cos(2 * Math.PI * p), rx = Math.abs(c) * r;
    var waxing = p < 0.5;
    var outer = waxing ? 1 : 0;
    var term = waxing ? (c > 0 ? 0 : 1) : (c > 0 ? 1 : 0);
    var d = "M50 " + (50 - r) + " A" + r + " " + r + " 0 0 " + outer + " 50 " + (50 + r) + " A" + rx.toFixed(2) + " " + r + " 0 0 " + term + " 50 " + (50 - r) + " Z";
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="rgba(20,32,56,0.55)"/><path d="' + d + '" fill="#eef1ff"/></svg>';
  }
  /* 0 to 1: how far the sun (day) or moon (night) has travelled between its rise and set */
  function celestialFraction(d) {
    var c = d.current, daily = d.daily;
    var now = new Date(c.time);
    var ti = daily.time.indexOf(c.time.slice(0, 10));
    if (ti < 0) return 0.5;
    var rise = new Date(daily.sunrise[ti]), set = new Date(daily.sunset[ti]);
    var start, end;
    if (c.is_day === 1) { start = rise; end = set; }
    else if (now > set) { start = set; end = daily.sunrise[ti + 1] ? new Date(daily.sunrise[ti + 1]) : new Date(rise.getTime() + 86400000); }
    else { start = daily.sunset[ti - 1] ? new Date(daily.sunset[ti - 1]) : new Date(set.getTime() - 86400000); end = rise; }
    var f = (now - start) / (end - start);
    return Math.max(0, Math.min(1, f));
  }
  /* ---------- tab icon: drawn on a small canvas to match the weather and the time of day ---------- */
  var ICON_BG = {
    day:   { clear: ["#3f8fd8", "#8cc4ee"], fair: ["#3f8fd8", "#8cc4ee"], partly: ["#4f93d2", "#9dc3e2"], cloudy: ["#7f93a5", "#b4c2ce"], fog: ["#98a5ae", "#c3cad0"], rain: ["#3d5160", "#61778a"], storm: ["#1f2a36", "#3d4c5b"], snow: ["#8fa6bb", "#c9d6e2"] },
    night: { clear: ["#050d20", "#1d3a66"], fair: ["#050d20", "#1d3a66"], partly: ["#0a1428", "#27416a"], cloudy: ["#0d1622", "#2f4256"], fog: ["#1a2430", "#3b4958"], rain: ["#0b131c", "#27384a"], storm: ["#070b11", "#242f3d"], snow: ["#1b2838", "#4a627a"] }
  };
  function circ(g, x, y, r) { g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.2832); }
  function iconCloud(g, dx, dy, s, fill) {
    g.fillStyle = fill; g.beginPath();
    circ(g, dx + 22 * s, dy + 38 * s, 8 * s);
    circ(g, dx + 33 * s, dy + 32 * s, 11 * s);
    circ(g, dx + 43 * s, dy + 38 * s, 8 * s);
    g.rect(dx + 22 * s, dy + 38 * s, 21 * s, 8 * s);
    g.fill();
  }
  function iconSun(g, x, y, r) {
    g.strokeStyle = "#ffd84d"; g.lineWidth = Math.max(2, r / 4); g.lineCap = "round";
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      g.beginPath();
      g.moveTo(x + Math.cos(a) * (r + 4), y + Math.sin(a) * (r + 4));
      g.lineTo(x + Math.cos(a) * (r + 4 + r * 0.5), y + Math.sin(a) * (r + 4 + r * 0.5));
      g.stroke();
    }
    g.fillStyle = "#ffd84d"; g.beginPath(); circ(g, x, y, r); g.fill();
  }
  function iconMoon(g, x, y, r) {
    var t = document.createElement("canvas"); t.width = 64; t.height = 64;
    var k = t.getContext("2d");
    k.fillStyle = "#eef1ff"; k.beginPath(); circ(k, x, y, r); k.fill();
    k.globalCompositeOperation = "destination-out";
    k.beginPath(); circ(k, x + r * 0.55, y - r * 0.35, r * 0.85); k.fill();
    g.drawImage(t, 0, 0);
  }
  function iconStar(g, x, y, r) { g.fillStyle = "#ffffff"; g.beginPath(); circ(g, x, y, r); g.fill(); }

  function updateTabIcon(kind, night) {
    try {
      var cv = document.createElement("canvas"); cv.width = 64; cv.height = 64;
      var g = cv.getContext("2d");
      var bg = (night ? ICON_BG.night : ICON_BG.day)[kind] || ICON_BG.day.clear;
      var grad = g.createLinearGradient(0, 0, 0, 64);
      grad.addColorStop(0, bg[0]); grad.addColorStop(1, bg[1]);
      g.fillStyle = grad;
      g.beginPath();
      if (g.roundRect) g.roundRect(0, 0, 64, 64, 14); else g.rect(0, 0, 64, 64);
      g.fill();
      var cloudFill = night ? "#c9d3de" : "#ffffff";

      if (kind === "clear" || kind === "fair") {
        if (night) { iconMoon(g, 30, 33, 15); iconStar(g, 47, 17, 2); iconStar(g, 51, 36, 1.5); iconStar(g, 14, 15, 1.5); }
        else iconSun(g, 32, 32, 11);
      } else if (kind === "partly") {
        if (night) iconMoon(g, 24, 25, 11); else iconSun(g, 25, 25, 8);
        iconCloud(g, 2, 2, 1, cloudFill);
      } else if (kind === "cloudy") {
        iconCloud(g, 0, -2, 1.05, cloudFill);
      } else if (kind === "fog") {
        iconCloud(g, 0, -8, 1, cloudFill);
        g.strokeStyle = cloudFill; g.lineWidth = 3; g.lineCap = "round";
        [[16, 50, 48], [20, 57, 44]].forEach(function (l) { g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[1]); g.stroke(); });
      } else if (kind === "rain") {
        iconCloud(g, 0, -8, 1, cloudFill);
        g.strokeStyle = "#9fd0ff"; g.lineWidth = 3; g.lineCap = "round";
        [22, 32, 42].forEach(function (x) { g.beginPath(); g.moveTo(x + 2, 44); g.lineTo(x - 2, 54); g.stroke(); });
      } else if (kind === "storm") {
        iconCloud(g, 0, -8, 1, cloudFill);
        g.fillStyle = "#ffd84d"; g.beginPath();
        g.moveTo(35, 40); g.lineTo(25, 52); g.lineTo(32, 52); g.lineTo(28, 62); g.lineTo(41, 47); g.lineTo(34, 47); g.closePath(); g.fill();
      } else if (kind === "snow") {
        iconCloud(g, 0, -8, 1, cloudFill);
        g.fillStyle = "#ffffff";
        [[22, 50], [32, 55], [42, 50]].forEach(function (p) { g.beginPath(); circ(g, p[0], p[1], 3); g.fill(); });
      }
      var link = $("favicon");
      link.type = "image/png";
      link.href = cv.toDataURL("image/png");
    } catch (e) {}
  }

  function applySky() {
    var d = state.data, c = d.current;
    var night = c.is_day === 0;
    updateTabIcon(kindFor(c.weather_code), night);
    document.body.setAttribute("data-sky", kindFor(c.weather_code));
    document.body.setAttribute("data-night", night ? "1" : "0");
    var f = celestialFraction(d);
    var sky = $("sky");
    sky.style.setProperty("--cx", (8 + 84 * f).toFixed(1) + "%");
    sky.style.setProperty("--cy", (60 - 46 * Math.sin(Math.PI * f)).toFixed(1) + "%");
    sky.style.setProperty("--rain-o", String(rainStrength(c.weather_code)));
    if (night) $("moon").innerHTML = moonSvg(moonPhase(new Date()));
  }
  function buildSky() {
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var i, n, box;
    box = $("stars");
    for (i = 0; i < 70; i++) {
      n = el("i", "star");
      var size = 1 + rnd() * 1.8;
      n.style.cssText = "left:" + (rnd() * 100).toFixed(1) + "%;top:" + (rnd() * 62).toFixed(1) + "%;width:" + size.toFixed(1) + "px;height:" + size.toFixed(1) + "px;animation-delay:-" + (rnd() * 6).toFixed(1) + "s";
      box.appendChild(n);
    }
    /* top %, scale, drift seconds, delay seconds, resting left % */
    var clouds = [[9, 1.3, 150, -30, 12], [22, 0.9, 120, -80, 55], [33, 1.6, 180, -120, 30], [15, 1.0, 135, -50, 80], [44, 1.2, 160, -100, 5], [27, 0.8, 110, -15, 68], [54, 1.4, 190, -140, 42]];
    box = $("clouds");
    clouds.forEach(function (c) {
      n = el("div", "cloud");
      n.style.cssText = "--t:" + c[0] + ";--s:" + c[1] + ";--dur:" + c[2] + "s;--delay:" + c[3] + "s;--x:" + c[4];
      box.appendChild(n);
    });
    box = $("rain");
    var small = window.innerWidth < 600;
    for (i = 0; i < (small ? 50 : 90); i++) {
      n = el("i", "drop");
      n.style.cssText = "--l:" + (rnd() * 100).toFixed(1) + "%;--y:" + (rnd() * 100).toFixed(0) + "vh;--d:" + (0.55 + rnd() * 0.5).toFixed(2) + "s;--dl:-" + (rnd() * 2).toFixed(2) + "s;--h:" + (14 + rnd() * 14).toFixed(0) + "px";
      box.appendChild(n);
    }
    box = $("snow");
    for (i = 0; i < (small ? 35 : 60); i++) {
      n = el("i", "flake");
      n.style.cssText = "--l:" + (rnd() * 100).toFixed(1) + "%;--y:" + (rnd() * 100).toFixed(0) + "vh;--d:" + (7 + rnd() * 7).toFixed(1) + "s;--dl:-" + (rnd() * 10).toFixed(1) + "s;--w:" + (2 + rnd() * 3).toFixed(1) + "px";
      box.appendChild(n);
    }
  }

  /* position in the hourly arrays of the current hour */
  function hourIndex() {
    var h = state.data.hourly, now = state.data.current.time.slice(0, 13);
    for (var i = 0; i < h.time.length; i++) { if (h.time[i].slice(0, 13) >= now) return i; }
    return 0;
  }

  /* one line on when it rains in the next 24 hours; an hour counts as wet with 0.2 mm or more, or a 60% chance */
  function rainSummary() {
    var d = state.data, h = d.hourly, c = d.current, i0 = hourIndex();
    var today = c.time.slice(0, 10);
    var end = Math.min(h.time.length - 1, i0 + 24);
    function wet(i) { return (h.precipitation[i] || 0) >= 0.2 || (h.precipitation_probability[i] || 0) >= 60; }
    function from(i) { var t = h.time[i]; return t.slice(0, 10) === today ? "das " + t.slice(11, 16) : "de amanhã às " + t.slice(11, 16); }
    function at(i) { var t = h.time[i]; return (t.slice(0, 10) === today ? "" : "amanhã ") + "às " + t.slice(11, 16); }
    var i, j = -1, peak = 0;
    for (i = i0; i <= end; i++) { peak = Math.max(peak, h.precipitation_probability[i] || 0); }

    if ((c.precipitation || 0) >= 0.1) {
      for (i = i0 + 1; i <= end; i++) { if (!wet(i)) { j = i; break; } }
      return { wet: true, text: j < 0 ? "A chover agora, sem paragem prevista nas próximas 24 horas" : "A chover agora. Deve parar " + at(j) };
    }
    for (i = i0; i <= end; i++) { if (wet(i)) { j = i; break; } }
    if (j < 0) return { wet: false, text: "Sem chuva prevista nas próximas 24 horas" };
    return { wet: true, text: "Chuva a partir " + from(j) + " · probabilidade até " + round(peak) + "%" };
  }

  /* current temperature against the same hour yesterday (the hourly data starts at yesterday 00:00) */
  function vsYesterday() {
    var h = state.data.hourly, c = state.data.current, k = hourIndex() - 24;
    if (k < 0 || h.temperature_2m[k] == null) return "";
    var diff = round(c.temperature_2m - h.temperature_2m[k]);
    if (diff === 0) return "Igual a ontem a esta hora";
    return (diff > 0 ? "Mais " : "Menos ") + Math.abs(diff) + "° do que ontem a esta hora";
  }

  function renderNow() {
    var c = state.data.current, p = state.places[state.active];
    applySky();
    $("now-label").textContent = p.name + (p.country ? ", " + p.country : "");
    var t = $("now-temp");
    t.textContent = round(c.temperature_2m);
    t.appendChild(el("sup", null, tempUnit()));
    $("now-cond").textContent = cond(c.weather_code);
    document.title = round(c.temperature_2m) + "° " + cond(c.weather_code) + " · " + p.name;
    $("now-feels").textContent = "Sensação térmica: " + round(c.apparent_temperature) + tempUnit();
    $("now-vs").textContent = vsYesterday();
    var rs = rainSummary();
    $("rain-sum").textContent = rs.text;
    $("rain-sum").className = "rain-sum" + (rs.wet ? " wet" : "");

    var today = state.data.daily.time.indexOf(c.time.slice(0, 10));
    var d = state.data.daily;
    var imp = state.units === "imperial";
    var items = [
      ["Vento", round(c.wind_speed_10m) + " " + windUnit() + " " + COMPASS[Math.round(c.wind_direction_10m / 45) % 8], c.wind_gusts_10m == null ? "" : "Rajadas de " + round(c.wind_gusts_10m) + " " + windUnit()],
      ["Humidade", round(c.relative_humidity_2m) + "%"],
      ["Pressão", round(c.pressure_msl) + " hPa"],
      ["Precipitação atual", (imp ? c.precipitation.toFixed(2) + " in" : c.precipitation.toFixed(1) + " mm")]
    ];
    if (today >= 0) {
      items.push(["Índice UV máximo", d.uv_index_max[today] == null ? "--" : d.uv_index_max[today].toFixed(1)]);
      items.push(["Nascer / pôr do sol", d.sunrise[today].slice(11, 16) + " – " + d.sunset[today].slice(11, 16)]);
    }
    var f = $("facts");
    f.textContent = "";
    items.forEach(function (it) {
      var w = el("div");
      w.appendChild(el("dt", null, it[0]));
      var dd = el("dd", null, it[1]);
      if (it[2]) dd.appendChild(el("small", null, it[2]));
      w.appendChild(dd);
      f.appendChild(w);
    });
  }

  function renderHourly() {
    var h = state.data.hourly, now = state.data.current.time.slice(0, 13);
    var start = 0;
    for (var i = 0; i < h.time.length; i++) { if (h.time[i].slice(0, 13) >= now) { start = i; break; } }
    var times = h.time.slice(start, start + 25);
    var temps = h.temperature_2m.slice(start, start + 25);
    var probs = h.precipitation_probability.slice(start, start + 25);
    var gusts = h.wind_gusts_10m.slice(start, start + 25);
    var svg = $("hourly");
    svg.textContent = "";
    if (temps.length < 2) return;

    /* the chart keeps room for a label every 2 hours; when the screen is narrower it scrolls sideways instead of dropping labels */
    var avail = Math.round(svg.parentNode.clientWidth || 600);
    var W = Math.max(avail, 540), H = 296, L = 62, R = 20, T = 34, B = 76;
    svg.style.width = W > avail ? W + "px" : "100%";
    $("chart-hint").hidden = !(W > avail);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var min = Math.floor(Math.min.apply(null, temps)) - 1;
    var max = Math.ceil(Math.max.apply(null, temps)) + 1;
    var plotW = W - L - R, plotH = H - T - B;
    function x(i) { return L + (i * plotW) / (temps.length - 1); }
    function y(v) { return T + plotH - ((v - min) / (max - min)) * plotH; }

    /* grid every 1, 2 or 5 degrees depending on the range, so the scale has small steps */
    var span = max - min;
    var step = span <= 6 ? 1 : (span <= 14 ? 2 : 5);
    for (var g = Math.ceil(min / step) * step; g <= max; g += step) {
      svg.appendChild(svgEl("line", { "class": "grid", x1: L, x2: W - R, y1: y(g), y2: y(g) }));
      var gt = svgEl("text", { x: L - 6, y: y(g) + 3, "text-anchor": "end" });
      gt.textContent = g + "°";
      svg.appendChild(gt);
    }

    /* where the next day starts: a tinted area from midnight onwards, a dashed line and a labelled tag */
    var mid = -1;
    for (var mi = 1; mi < times.length; mi++) { if (times[mi].slice(11, 13) === "00") { mid = mi; break; } }
    if (mid > 0) {
      var mx = x(mid);
      var dd = new Date(times[mid].slice(0, 10) + "T12:00:00");
      var chipText = "AMANHÃ · " + ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"][dd.getDay()] + " " + dd.getDate();
      if (mx < W - 1) svg.appendChild(svgEl("rect", { "class": "daytint", x: mx, y: 0, width: W - mx, height: H }));
      svg.appendChild(svgEl("line", { "class": "divider", x1: mx, x2: mx, y1: 22, y2: T + plotH + 6 }));
      var cw = Math.round(chipText.length * 6.2 + 18);
      var cx = Math.max(2, Math.min(mx - 1, W - cw - 2));
      svg.appendChild(svgEl("rect", { "class": "daychip", x: cx, y: 4, width: cw, height: 18, rx: 9 }));
      var ct = svgEl("text", { "class": "daychip-text", x: cx + cw / 2, y: 16, "text-anchor": "middle" });
      ct.textContent = chipText;
      svg.appendChild(ct);
    }

    var pts = temps.map(function (v, i) { return x(i).toFixed(1) + "," + y(v).toFixed(1); });
    svg.appendChild(svgEl("polygon", { "class": "area", points: pts.join(" ") + " " + x(temps.length - 1) + "," + (T + plotH) + " " + x(0) + "," + (T + plotH) }));
    svg.appendChild(svgEl("polyline", { "class": "line", points: pts.join(" ") }));
    svg.appendChild(svgEl("circle", { "class": "dot", cx: x(0), cy: y(temps[0]), r: 5 }));

    /* every 2 hours: temperature above the line, time and rain chance in two rows underneath */
    var rowTime = H - 48, rowRain = H - 30, rowWind = H - 12;
    var rl = svgEl("text", { "class": "row-label", x: 2, y: rowRain, "text-anchor": "start" });
    rl.textContent = "chuva";
    svg.appendChild(rl);
    var wl = svgEl("text", { "class": "row-label", x: 2, y: rowWind, "text-anchor": "start" });
    wl.textContent = "rajadas";
    svg.appendChild(wl);
    var every = 2;
    times.forEach(function (t, i) {
      if (i % every !== 0) return;
      var tt = svgEl("text", { "class": "temp-label", x: x(i), y: y(temps[i]) - 9, "text-anchor": "middle" });
      tt.textContent = round(temps[i]) + "°";
      svg.appendChild(tt);

      var tx = svgEl("text", { "class": "time-label", x: x(i), y: rowTime, "text-anchor": "middle" });
      tx.textContent = t.slice(11, 16);
      svg.appendChild(tx);

      var pr = probs[i];
      if (pr != null) {
        var rt = svgEl("text", { "class": "rain-label" + (pr === 0 ? " zero" : ""), x: x(i), y: rowRain, "text-anchor": "middle" });
        rt.textContent = round(pr) + "%";
        svg.appendChild(rt);
      }

      if (gusts[i] != null) {
        var gt2 = svgEl("text", { "class": "wind-label", x: x(i), y: rowWind, "text-anchor": "middle" });
        gt2.textContent = round(gusts[i]) + windUnit();
        svg.appendChild(gt2);
      }
    });
  }

  function dayName(iso, idx, todayIdx) {
    if (idx === todayIdx) return "Hoje";
    if (idx === todayIdx - 1) return "Ontem";
    if (idx === todayIdx + 1) return "Amanhã";
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("pt-PT", { weekday: "short", day: "numeric" });
  }

  function renderDays() {
    var d = state.data.daily;
    var todayIdx = d.time.indexOf(state.data.current.time.slice(0, 10));
    var gMin = Math.min.apply(null, d.temperature_2m_min);
    var gMax = Math.max.apply(null, d.temperature_2m_max);
    var span = gMax - gMin || 1;
    $("range-note").textContent = "Variação: " + round(gMin) + " a " + round(gMax) + tempUnit();

    var box = $("days");
    box.textContent = "";
    d.time.forEach(function (iso, i) {
      var row = el("div", "day" + (i < todayIdx ? " past" : "") + (i === todayIdx ? " today" : ""));
      row.appendChild(el("span", "dname", dayName(iso, i, todayIdx)));
      var rain = d.precipitation_sum[i] || 0;
      var cc = el("span", "dcond");
      cc.appendChild(el("span", null, cond(d.weather_code[i])));
      cc.appendChild(el("small", null, rain > 0 ? rain.toFixed(1) + " mm" : "sem chuva"));
      row.appendChild(cc);
      row.appendChild(el("span", "lo", round(d.temperature_2m_min[i]) + "°"));
      var track = el("div", "track");
      var fill = el("div", "fill");
      fill.style.left = (((d.temperature_2m_min[i] - gMin) / span) * 100) + "%";
      fill.style.right = (100 - ((d.temperature_2m_max[i] - gMin) / span) * 100) + "%";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("span", "hi", round(d.temperature_2m_max[i]) + "°"));
      box.appendChild(row);
    });
  }

  /* ---------- IPMA warnings ---------- */
  function strip(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

  /* which IPMA district a place belongs to; null outside mainland Portugal */
  function areaFor(p) {
    if (p.area && AREAS[p.area]) return { code: p.area, approx: false };
    if (p.country && strip(p.country) !== "portugal") return null;
    if (p.lat < 36.8 || p.lat > 42.2 || p.lon < -9.6 || p.lon > -6.1) return null;
    var name = strip(p.admin1), k;
    for (k in AREAS) { if (strip(AREAS[k][0]) === name) return { code: k, approx: false }; }
    var best = null, bestD = Infinity, cos = Math.cos(p.lat * Math.PI / 180);
    for (k in AREAS) {
      var dx = (AREAS[k][2] - p.lon) * cos, dy = AREAS[k][1] - p.lat, dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = k; }
    }
    return { code: best, approx: true };
  }

  var warnReq = 0;
  function fetchWarnings() {
    var id = ++warnReq;
    return fetch(IPMA_URL)
      .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
      .then(function (list) {
        if (id !== warnReq) return;
        state.warnings = Array.isArray(list) ? list : ((list && list.data) || []);
        state.warnError = false;
        renderWarnings();
      })
      .catch(function () {
        if (id !== warnReq) return;
        state.warnError = true;
        renderWarnings();
      });
  }

  function dayWord(d) {
    var t0 = new Date(); t0.setHours(0, 0, 0, 0);
    var diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 86400000);
    if (diff === 0) return "hoje";
    if (diff === 1) return "amanhã";
    if (diff === -1) return "ontem";
    return d.toLocaleDateString("pt-PT", { weekday: "short", day: "numeric" });
  }
  function hm(d) { return d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" }); }
  function whenLabel(s, e) {
    var a = new Date(s), b = new Date(e);
    if (isNaN(a) || isNaN(b)) return "";
    return dayWord(a) + " " + hm(a) + " – " + dayWord(b) + " " + hm(b);
  }

  function renderWarnings() {
    var box = $("warn"), p = state.places[state.active], area = areaFor(p);
    box.textContent = "";
    if (!area) { box.hidden = true; return; }
    box.hidden = false;

    var head = el("div", "warn-head");
    head.appendChild(el("p", "label", "Avisos IPMA · distrito de " + AREAS[area.code][0] + (area.approx ? " (zona aproximada)" : "")));
    var link = el("a", null, "Ver no IPMA");
    link.href = IPMA_LINK; link.target = "_blank"; link.rel = "noopener";
    head.appendChild(link);
    box.appendChild(head);

    if (state.warnings === null) {
      box.appendChild(el("p", "warn-ok", state.warnError ? "Não foi possível carregar os avisos do IPMA. Consulta o site do IPMA." : "A carregar avisos..."));
      return;
    }
    var mine = state.warnings.filter(function (w) { return w.idAreaAviso === area.code; });
    if (!mine.length) {
      box.appendChild(el("p", "warn-ok", "Esta zona não aparece nos dados do IPMA, por isso não é possível confirmar se há avisos. Consulta o site do IPMA."));
      return;
    }

    var now = Date.now(), horizon = now + 24 * 3600 * 1000;
    var rank = { yellow: 1, orange: 2, red: 3 };
    var names = { yellow: "Amarelo", orange: "Laranja", red: "Vermelho" };
    function lvl(w) { return String(w.awarenessLevelID || "").toLowerCase(); }
    var active = mine.filter(function (w) {
      if (!rank[lvl(w)]) return false;
      var s = new Date(w.startTime).getTime(), e = new Date(w.endTime).getTime();
      if (isNaN(s)) s = now;
      if (isNaN(e)) e = horizon;
      return e > now && s < horizon;
    }).sort(function (a, b) {
      return (rank[lvl(b)] - rank[lvl(a)]) || (new Date(a.startTime) - new Date(b.startTime)) || 0;
    });

    if (!active.length) {
      box.appendChild(el("p", "warn-ok", "Sem avisos ativos nem previstos para as próximas 24 horas."));
      return;
    }
    active.forEach(function (w) {
      var det = el("details");
      var sum = el("summary");
      sum.appendChild(el("span", "lvl " + lvl(w), names[lvl(w)]));
      sum.appendChild(el("span", "warn-type", w.awarenessTypeName || "Aviso"));
      sum.appendChild(el("span", "warn-when", whenLabel(w.startTime, w.endTime)));
      det.appendChild(sum);
      if (w.text) det.appendChild(el("p", "warn-text", w.text));
      box.appendChild(det);
    });
  }

  /* ---------- search ---------- */
  var searchTimer = null, searchId = 0;
  function hideResults() { $("results").hidden = true; $("results").textContent = ""; }

  $("q").addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(searchTimer);
    if (q.length < 2) { hideResults(); return; }
    searchTimer = setTimeout(function () {
      var id = ++searchId;
      fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=6&language=pt&format=json")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (id !== searchId) return;
          var list = $("results");
          list.textContent = "";
          var res = d.results || [];
          if (!res.length) {
            var li = el("li"); var none = el("button", null, "Não foram encontrados locais"); none.type = "button"; none.disabled = true; li.appendChild(none); list.appendChild(li);
          }
          res.forEach(function (r) {
            var li = el("li");
            var b = el("button");
            b.type = "button";
            b.appendChild(document.createTextNode(r.name + " "));
            b.appendChild(el("small", null, [r.admin1, r.country].filter(Boolean).join(", ")));
            b.addEventListener("click", function () { addPlace({ name: r.name, country: r.country || "", admin1: r.admin1 || "", lat: r.latitude, lon: r.longitude }); });
            li.appendChild(b);
            list.appendChild(li);
          });
          list.hidden = false;
        })
        .catch(function () { hideResults(); showError("A pesquisa de locais falhou. Verifica a tua ligação à Internet."); });
    }, 300);
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) hideResults(); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Escape") hideResults(); });

  function addPlace(p) {
    var found = -1;
    state.places.forEach(function (x, i) { if (Math.abs(x.lat - p.lat) < 0.01 && Math.abs(x.lon - p.lon) < 0.01) found = i; });
    if (found === -1) { state.places.push(p); found = state.places.length - 1; }
    state.active = found;
    store("wl.places", state.places); store("wl.active", found);
    $("q").value = "";
    hideResults();
    state.data = null; clearView(); render(); fetchWeather();
  }

  /* ---------- units + refresh ---------- */
  function setUnits(u) {
    state.units = "metric";
    store("wl.units", "metric");
    if (state.data) fetchWeather();
  }
  $("refresh").addEventListener("click", fetchWeather);

  /* redraw the chart when the width changes (rotating a phone, resizing a window) */
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (state.data) renderHourly(); }, 150);
  });

  /* touch screens: the map ignores touches until tapped, so the page can still be scrolled */
  var mapUnlocked = false;
  $("mapshield").addEventListener("click", function () {
    mapUnlocked = !mapUnlocked;
    this.classList.toggle("unlocked", mapUnlocked);
    $("shield-text").textContent = mapUnlocked ? "Bloquear mapa" : "Toca para mexer no mapa";
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.fetchedAt && Date.now() - state.fetchedAt.getTime() > REFRESH_MS) fetchWeather();
  });
  setInterval(function () { if (!document.hidden) fetchWeather(); }, REFRESH_MS);

  /* ---------- start ---------- */
  var savedPlaces = load("wl.places", null);
  if (Array.isArray(savedPlaces) && savedPlaces.length) state.places = savedPlaces;
  /* a Montijo saved by an earlier version has no district yet */
  state.places.forEach(function (p) {
    if (!p.area && Math.abs(p.lat - 38.7066) < 0.02 && Math.abs(p.lon + 8.9733) < 0.02) p.area = "STB";
  });
  var savedActive = load("wl.active", 0);
  state.active = (typeof savedActive === "number" && savedActive < state.places.length) ? savedActive : 0;
  setUnits("metric");
  buildSky();
  renderPlaces();
  updateMap();
  fetchWeather();

  /* installable app: only when served from a web address, never when opened as a local file */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
